name: PR Discord Notify

on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      # Envia como embed.description (limite 4096) em vez de appleboy/discord-action,
      # que coloca a mensagem inteira no title do embed (limite 256) e estoura com
      # títulos de PR longos, além de fatiar a mensagem em cada vírgula.
      # Dados do PR entram via env (nunca interpolados no script) por segurança
      # com pull_request_target.
      - name: Notify Discord - New PR
        env:
          WEBHOOK_URL: https://discord.com/api/webhooks/${{ secrets.DISCORD_WEBHOOK_ID }}/${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          desc=$(printf '🔔 **Nova Pull Request criada**\nRepositório: `%s`\nPR: [#%s - %s](%s)\nAutor: `%s`\nOrigem: `%s`\nDestino: `%s`' \
            "$REPO" "$PR_NUMBER" "$PR_TITLE" "$PR_URL" "$PR_AUTHOR" "$HEAD_REF" "$BASE_REF")
          jq -n --arg desc "$desc" '{embeds: [{description: $desc, color: 5793266}]}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK_URL"
