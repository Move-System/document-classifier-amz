name: No direct push (alerta)

# O plano Free não bloqueia push direto no servidor. Este workflow DETECTA: se um
# commit entrou na dev/main SEM PR associado, dispara um alerta no Discord com o
# autor e o commit. (Detective — não impede, expõe. Bloqueio real = GitHub Team.)
on:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Alertar push direto (sem PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          WEBHOOK_URL: https://discord.com/api/webhooks/${{ secrets.DISCORD_WEBHOOK_ID }}/${{ secrets.DISCORD_WEBHOOK_TOKEN }}
        run: |
          [ "$PUSHER" = "github-actions[bot]" ] && exit 0
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$PR" ]; then echo "commit via PR #$PR — ok"; exit 0; fi
          SUBJ=$(printf '%s' "$MSG" | head -1)
          echo "::warning title=Push direto::$PUSHER empurrou direto em $BRANCH sem PR — $SUBJ"
          BODY=$(jq -nc --arg b "$BRANCH" --arg u "$PUSHER" --arg s "${SHA:0:8}" --arg m "$SUBJ" \
            '{content: ("⚠️ **Push direto detectado** em `\($b)` sem Pull Request\nAutor: **\($u)**  ·  commit `\($s)`\n> \($m)\n\nMudanças devem entrar por **PR**. Se foi emergencial consciente, tudo bem — fica só o registro.")}')
          curl -s -m 15 -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK_URL" >/dev/null || echo "(discord indisponível; alerta ficou no log da Action)"
