name: Bypass guard

# "Bypass só pode ser aprovado por mim": se alguém que NÃO é o aprovador marca um
# PR como 'ready' com a CI ainda não verde, o robô volta o PR para rascunho.
# (pull_request_target roda a partir da branch default, com token de escrita.)
on:
  pull_request_target:
    types: [ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Re-rascunhar bypass não autorizado
        env:
          GH_TOKEN: ${{ secrets.GUARD_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
          HEADSHA: ${{ github.event.pull_request.head.sha }}
          APPROVER: ${{ vars.BYPASS_APPROVER || 'Kemuel-sepulvida' }}
        run: |
          if [ "$SENDER" = "$APPROVER" ]; then echo "$SENDER é o aprovador — bypass liberado."; exit 0; fi
          CR=$(gh api "repos/$REPO/commits/$HEADSHA/check-runs" --paginate \
                --jq '[.check_runs[] | select(.name=="card" or .name=="lint" or .name=="test" or .name=="sonar")]')
          OK=$(echo "$CR" | jq '(length==4) and (all(.[]; .conclusion=="success"))' 2>/dev/null || echo false)
          if [ "$OK" = "true" ]; then echo "4 checks verdes — pode ficar ready."; exit 0; fi
          echo "CI não verde e '$SENDER' != aprovador '$APPROVER' → re-rascunhando #$PR"
          gh pr ready "$PR" --repo "$REPO" --undo || true
          gh pr comment "$PR" --repo "$REPO" --body "⛔ **Bypass não autorizado.** Apenas @$APPROVER pode liberar o merge com a CI vermelha/pendente. O PR voltou para **rascunho** até a CI ficar verde (ou @$APPROVER marcar como ready)."
