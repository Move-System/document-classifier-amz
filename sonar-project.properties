# SonarQube — Document Classifier AMZ
# Analisado pela sonarsource/sonarqube-scan-action na CI (mesma régua do SGVP).
sonar.projectKey=document-classifier-amz
sonar.projectName=Document Classifier AMZ
sonar.sources=.
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=node_modules/**,coverage/**,knowledge/**,test/**,fixtures/**,examples.json
sonar.coverage.exclusions=test/**,scripts/**,fixtures/**
sonar.qualitygate.wait=true
